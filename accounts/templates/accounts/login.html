{% extends 'base.html' %}

{% block title %}Login - Vision Guard{% endblock %}

{% block full_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <div class="text-center mb-4">
                <i class="bi bi-shield-check text-info fs-1"></i>
                <h2 class="mt-2">Vision Guard</h2>
                <p class="text-secondary">Please sign in to continue</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <button type="submit" class="btn btn-info w-100 py-2 fw-bold">Login</button>
            </form>
            {% if form.errors %}
            <div class="alert alert-danger mt-3">
                Invalid username or password.
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

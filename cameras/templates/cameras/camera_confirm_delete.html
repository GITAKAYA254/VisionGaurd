{% extends 'base.html' %}

{% block title %}Delete Camera - Vision Guard{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-3 text-danger">Delete Camera</h3>
            <p>Are you sure you want to delete <strong>{{ object.name }}</strong> at {{ object.location_name }}?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'camera_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

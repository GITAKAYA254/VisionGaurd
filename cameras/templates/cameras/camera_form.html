{% extends 'base.html' %}

{% block title %}{% if object %}Edit{% else %}Add{% endif %} Camera - Vision Guard{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-4">{% if object %}Edit Camera: {{ object.name }}{% else %}Add New Camera{% endif %}</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Camera Name</label>
                    <input type="text" name="name" class="form-control bg-dark text-light border-secondary" value="{{ object.name|default:'' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Stream URL (RTSP/HTTP)</label>
                    <input type="text" name="stream_url" class="form-control bg-dark text-light border-secondary" value="{{ object.stream_url|default:'' }}" placeholder="rtsp://user:pass@ip:port" required>
                    <div class="form-text text-secondary">Use '0' for local webcam testing</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Location Name</label>
                    <input type="text" name="location_name" class="form-control bg-dark text-light border-secondary" value="{{ object.location_name|default:'' }}" placeholder="Gate A, Perimeter North" required>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Latitude</label>
                            <input type="number" step="0.000001" name="latitude" class="form-control bg-dark text-light border-secondary" value="{{ object.latitude|default:'' }}">
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Longitude</label>
                            <input type="number" step="0.000001" name="longitude" class="form-control bg-dark text-light border-secondary" value="{{ object.longitude|default:'' }}">
                        </div>
                    </div>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if not object or object.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="isActive">Camera is Active</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-info px-4">Save Camera</button>
                    <a href="{% url 'camera_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

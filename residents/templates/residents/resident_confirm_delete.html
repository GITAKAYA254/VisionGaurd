{% extends 'base.html' %}
{% block title %}Delete Resident{% endblock %}
{% block content %}
<div class="card p-4 col-md-6 mx-auto">
    <h3>Delete {{ object.full_name }}?</h3>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'resident_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
